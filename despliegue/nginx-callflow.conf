# Nginx delante de Gunicorn. Instalar:
#   sudo cp despliegue/nginx-callflow.conf /etc/nginx/sites-available/callflow
#   sudo ln -s /etc/nginx/sites-available/callflow /etc/nginx/sites-enabled/callflow
#   sudo rm -f /etc/nginx/sites-enabled/default && sudo nginx -t && sudo systemctl reload nginx
# Reemplazar callflow.EJEMPLO.com por el nombre real y las rutas del certificado (ver INSTALACION.md, paso 7).

upstream callflow_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

# HTTP → HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://callflow.EJEMPLO.com$request_uri;
}

server {
    # "http2" va en el listen porque Ubuntu 24.04 trae Nginx 1.24, que no conoce la directiva "http2 on;" (1.25+).
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name callflow.EJEMPLO.com;

    ssl_certificate     /etc/letsencrypt/live/callflow.EJEMPLO.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/callflow.EJEMPLO.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Adjuntos: la app acepta hasta 10 MB (TAMANO_MAXIMO_ARCHIVO); un poco más por el resto del formulario.
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # CSS, JS e imágenes del diseño: directo desde disco (python manage.py collectstatic).
    location /static/ {
        alias /srv/callflow/staticfiles/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
    }

    # Los documentos (CV, roles de pago, actas) NO se sirven desde aquí: pasan por CALLFLOW, que revisa permisos.
    location /media/ {
        return 404;
    }

    location / {
        proxy_pass http://callflow_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Se reemplaza (no se agrega) la IP real: así nadie puede falsificarla enviando su propia cabecera.
        # La usan TI › Conectados y el límite de peticiones (con TI_PROXY_CONFIABLE=True).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;   # un poco más que el timeout de Gunicorn
        proxy_redirect off;
    }
}
