{% extends "base.html" %}
{% block titulo %}Movimientos · Inventario{% endblock %}
{% block contenido %}
{% include "inventario/_subnav.html" with seccion="movimientos" %}
<form class="row g-2 align-items-end mb-3" hx-get="{% url 'inventario:movimientos' %}" hx-target="#tabla-movimientos" hx-trigger="change, submit" hx-push-url="true">
  <div class="col-md-4">
    <label class="form-label small mb-1" for="f-material">Material</label>
    <select id="f-material" name="material" class="form-select">
      <option value="">Todos</option>
      {% for m in lista_materiales %}<option value="{{ m.pk }}" {% if m.pk|stringformat:"s" == material %}selected{% endif %}>{{ m.nombre }}</option>{% endfor %}
    </select>
  </div>
  <div class="col-md-3">
    <label class="form-label small mb-1" for="f-tipo">Tipo</label>
    <select id="f-tipo" name="tipo" class="form-select">
      <option value="">Todos</option>
      {% for valor, texto in tipos %}<option value="{{ valor }}" {% if valor == tipo %}selected{% endif %}>{{ texto }}</option>{% endfor %}
    </select>
  </div>
  <div class="col-6 col-md-2">
    <label class="form-label small mb-1" for="f-desde">Desde</label>
    <input id="f-desde" type="date" name="desde" class="form-control" value="{{ desde|date:'Y-m-d' }}">
  </div>
  <div class="col-6 col-md-2">
    <label class="form-label small mb-1" for="f-hasta">Hasta</label>
    <input id="f-hasta" type="date" name="hasta" class="form-control" value="{{ hasta|date:'Y-m-d' }}">
  </div>
</form>
<div id="tabla-movimientos">
  {% include "inventario/_movimientos_tabla.html" %}
</div>
{% endblock %}
