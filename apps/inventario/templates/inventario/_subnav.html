<div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
  <div>
    <h1 class="h3 mb-0">Inventario</h1>
    <p class="text-body-secondary small mb-0">Materiales de oficina, existencias y movimientos.</p>
  </div>
  <div class="d-flex flex-wrap gap-2">
    {% if perms.inventario.add_movimientoinventario %}
    <a href="{% url 'inventario:movimiento_crear' %}" class="btn btn-primary"><i class="bi bi-arrow-left-right me-1" aria-hidden="true"></i>Registrar movimiento</a>
    {% endif %}
    {% if perms.inventario.add_material %}
    <a href="{% url 'inventario:material_crear' %}" class="btn btn-outline-primary"><i class="bi bi-plus-lg me-1" aria-hidden="true"></i>Nuevo material</a>
    {% endif %}
  </div>
</div>
<ul class="nav nav-underline mb-4 subnav-modulo">
  <li class="nav-item"><a class="nav-link {% if seccion == 'materiales' %}active{% endif %}" href="{% url 'inventario:materiales' %}"><i class="bi bi-box-seam me-1" aria-hidden="true"></i>Materiales</a></li>
  <li class="nav-item"><a class="nav-link {% if seccion == 'movimientos' %}active{% endif %}" href="{% url 'inventario:movimientos' %}"><i class="bi bi-arrow-left-right me-1" aria-hidden="true"></i>Movimientos</a></li>
</ul>
