<div class="cabecera-bodega">
  <div>
    <h1 class="h3 mb-1">Bodega</h1>
    <p class="text-body-secondary small mb-0">Existencias y movimientos de los suministros de oficina</p>
  </div>
  <div class="d-flex flex-wrap gap-2">
    {% if perms.inventario.add_material %}
    <a href="{% url 'inventario:material_crear' %}" class="btn btn-outline-secondary"><i class="bi bi-plus-lg me-1" aria-hidden="true"></i>Nuevo material</a>
    {% endif %}
    {% if perms.inventario.add_movimientoinventario %}
    <a href="{% url 'inventario:movimiento_crear' %}" class="btn btn-primary">Registrar movimiento</a>
    {% endif %}
  </div>
</div>
<ul class="nav nav-underline mb-4 subnav-modulo">
  <li class="nav-item"><a class="nav-link {% if seccion == 'materiales' %}active{% endif %}" href="{% url 'inventario:materiales' %}">Existencias</a></li>
  <li class="nav-item"><a class="nav-link {% if seccion == 'movimientos' %}active{% endif %}" href="{% url 'inventario:movimientos' %}">Movimientos</a></li>
</ul>
