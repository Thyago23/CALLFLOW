{# Cada 3 s: mensajes nuevos de este chat, quién escribe, «Visto» y la conexión. Minimizado no marca como leído. #}
<div id="sondeo-{{ actual.pk }}" hx-get="{% url 'mensajes:nuevos' actual.pk %}?despues={{ ultimo_id }}" hx-trigger="every 3s" hx-swap="none"
     hx-vals='js:{leer: window.CallflowChat ? CallflowChat.leer({{ actual.pk }}) : "1"}'{% if oob %} hx-swap-oob="true"{% endif %}></div>
