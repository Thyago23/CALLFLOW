{% load interfaz %}
<div class="toast aviso-flotante tono-{{ n.tono }}{% if n.fija %} fija{% endif %}" role="{% if n.fija %}alert{% else %}status{% endif %}" aria-live="{% if n.fija %}assertive{% else %}polite{% endif %}" aria-atomic="true"
     data-bs-autohide="{{ n.fija|yesno:'false,true' }}" data-bs-delay="10000">
  <div class="aviso-cuerpo">
    <span class="icono-notificacion tono-{{ n.tono }}" aria-hidden="true"><i class="bi bi-{{ n.icono }}"></i></span>
    <div class="min-w-0 flex-grow-1">
      <div class="aviso-encabezado">
        <span>{{ n.get_tipo_display }}</span>
        <span aria-hidden="true">·</span>
        <time datetime="{{ n.creado_en|date:'c' }}">{{ n.creado_en|hace }}</time>
      </div>
      <a class="aviso-titulo stretched-link" href="{% url 'notificacion_abrir' n.pk %}">{{ n.titulo }}</a>
      {% if n.mensaje %}<p class="aviso-mensaje">{{ n.mensaje }}</p>{% endif %}
      {% if n.fija %}<span class="aviso-accion" aria-hidden="true">{% if n.tipo == "AGENDA" %}Ver evento{% else %}Ver{% endif %}<i class="bi bi-arrow-right-short"></i></span>{% endif %}
    </div>
    <button type="button" class="btn-close aviso-cerrar" data-bs-dismiss="toast" aria-label="Cerrar aviso"></button>
  </div>
  {% if not n.fija %}<div class="aviso-tiempo" aria-hidden="true"></div>{% endif %}
</div>
