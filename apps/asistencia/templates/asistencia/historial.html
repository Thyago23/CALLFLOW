{% extends "base.html" %}
{% block titulo %}Historial · Asistencia{% endblock %}
{% block contenido %}
{% include "asistencia/_subnav.html" with seccion="historial" %}
<form class="row g-2 align-items-end mb-3" method="get" hx-get="{% url 'asistencia:historial' %}" hx-target="#resultado-historial" hx-trigger="change, submit" hx-push-url="true">
  <div class="col-md-5">
    <label class="form-label small mb-1" for="{{ filtro.empleado.id_for_label }}">Empleado</label>
    {{ filtro.empleado }}
  </div>
  <div class="col-6 col-md-3">
    <label class="form-label small mb-1" for="{{ filtro.desde.id_for_label }}">Desde</label>
    <input type="date" name="desde" id="{{ filtro.desde.id_for_label }}" class="form-control" value="{{ desde|date:'Y-m-d' }}">
  </div>
  <div class="col-6 col-md-3">
    <label class="form-label small mb-1" for="{{ filtro.hasta.id_for_label }}">Hasta</label>
    <input type="date" name="hasta" id="{{ filtro.hasta.id_for_label }}" class="form-control" value="{{ hasta|date:'Y-m-d' }}">
  </div>
</form>
<div id="resultado-historial">
  {% include "asistencia/_historial_resultado.html" %}
</div>
{% endblock %}
