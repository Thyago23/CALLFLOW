{% extends "base.html" %}
{% block titulo %}Formularios DAMI · Ventas{% endblock %}
{% block contenido %}
{% include "ventas/_subnav.html" with seccion="formularios" %}
<form class="row g-2 align-items-end mb-3" role="search" hx-get="{% url 'ventas:formularios' %}" hx-target="#tabla-formularios"
      hx-trigger="input changed delay:300ms from:#busqueda, change, submit" hx-push-url="true">
  <div class="col-md-5">
    <label class="form-label small mb-1" for="busqueda">Buscar</label>
    <input id="busqueda" type="search" name="q" value="{{ q }}" class="form-control" placeholder="Cédula, RUC, ciudad o DAMI-000123" autocomplete="off">
  </div>
  <div class="col-sm-4 col-md-3">
    <label class="form-label small mb-1" for="f-estado">Estado</label>
    <select id="f-estado" name="estado" class="form-select">
      <option value="">Todos</option>
      {% for valor, texto in estados %}<option value="{{ valor }}" {% if valor == estado %}selected{% endif %}>{{ texto }}</option>{% endfor %}
    </select>
  </div>
  <div class="col-6 col-sm-4 col-md-2">
    <label class="form-label small mb-1" for="f-desde">Desde</label>
    <input id="f-desde" type="date" name="desde" class="form-control" value="{{ desde|date:'Y-m-d' }}">
  </div>
  <div class="col-6 col-sm-4 col-md-2">
    <label class="form-label small mb-1" for="f-hasta">Hasta</label>
    <input id="f-hasta" type="date" name="hasta" class="form-control" value="{{ hasta|date:'Y-m-d' }}">
  </div>
</form>
<div id="tabla-formularios">
  {% include "ventas/_formularios_tabla.html" %}
</div>
{% endblock %}
