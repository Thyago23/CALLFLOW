<div class="hora-laboral d-flex align-items-center gap-1{% if 'is-invalid' in widget.attrs.class %} is-invalid{% endif %}"
     data-inicio="{{ widget.inicio }}" data-fin="{{ widget.fin }}" data-cierre="{{ widget.incluir_cierre|yesno:'1,0' }}">
  <select name="{{ widget.name }}_h" id="{{ widget.attrs.id }}_h" class="form-select w-auto{% if 'is-invalid' in widget.attrs.class %} is-invalid{% endif %}"
          aria-label="Hora" {% if widget.attrs.required %}required{% endif %}>
    {% if widget.opcional %}<option value="" {% if not widget.hora_sel %}selected{% endif %}>--</option>{% endif %}
    {% for h in widget.horas %}<option value="{{ h }}" {% if h == widget.hora_sel %}selected{% endif %}>{{ h }}</option>{% endfor %}
  </select>
  <span class="fw-semibold" aria-hidden="true">:</span>
  <select name="{{ widget.name }}_m" id="{{ widget.attrs.id }}_m" class="form-select w-auto{% if 'is-invalid' in widget.attrs.class %} is-invalid{% endif %}" aria-label="Minutos">
    {% for m in widget.minutos %}<option value="{{ m }}" {% if m == widget.minuto_sel %}selected{% endif %}>{{ m }}</option>{% endfor %}
  </select>
</div>
<script>
  // En la primera y la última hora de la jornada solo se ofrecen los minutos que caben dentro de ella.
  (function (caja) {
    const [selHora, selMin] = caja.querySelectorAll("select");
    const [hIni, mIni] = caja.dataset.inicio.split(":").map(Number);
    const [hFin, mFin] = caja.dataset.fin.split(":").map(Number);
    const cierre = caja.dataset.cierre === "1";
    function ajustar() {
      const h = Number(selHora.value);
      let primero = null;
      selMin.querySelectorAll("option").forEach(function (o) {
        const m = Number(o.value);
        const fuera = selHora.value !== "" && ((h === hIni && m < mIni) || (h === hFin && (cierre ? m > mFin : m >= mFin)));
        o.disabled = fuera;
        o.hidden = fuera;
        if (!fuera && primero === null) primero = o;
      });
      if (selMin.selectedOptions[0] && selMin.selectedOptions[0].disabled && primero) selMin.value = primero.value;
    }
    selHora.addEventListener("change", ajustar);
    ajustar();
  })(document.currentScript.previousElementSibling);
</script>
