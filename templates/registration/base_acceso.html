{% extends "base.html" %}
{% load static %}
{% block cuerpo %}
<div class="pantalla-acceso">
  <section class="panel-marca d-none d-lg-flex">
    <div class="insignia-callflow">
      <span class="marca-logo" aria-hidden="true"><i class="bi bi-headset"></i></span>
      <span>CALLFLOW</span>
    </div>
    <div class="circulo-logo">
      <img src="{% static 'img/logo-multivisa.png' %}" alt="Multivisa · asesoría migratoria" class="logo-acceso" width="640" height="621">
    </div>
  </section>
  <section class="panel-formulario">
    <div class="formulario-acceso">
      <div class="d-flex d-lg-none align-items-center gap-2 mb-4">
        <img src="{% static 'img/logo-multivisa.png' %}" alt="" class="logo-marca" width="640" height="621">
        <span class="fs-4 fw-semibold">CALLFLOW</span>
      </div>
      {% for message in messages %}
      <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}" role="alert">{{ message }}</div>
      {% endfor %}
      {% block formulario %}{% endblock %}
    </div>
  </section>
</div>
{% endblock %}
